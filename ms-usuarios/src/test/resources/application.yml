spring:
  datasource:
    url: jdbc:h2:mem:usuarios;MODE=Oracle;DB_CLOSE_DELAY=-1
    username: sa
    password:
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: create-drop
app:
  services:
    catalogo-url: http://localhost:8083
  # En tests no se publica a RabbitMQ (no hay broker)
  messaging:
    habilitado: false
    exchanges:
      usuarios-eventos: gestorcitas.usuarios.eventos
    routing-keys:
      usuario-registrado: usuario.registrado
      usuario-activado: usuario.activado
      usuario-desactivado: usuario.desactivado
