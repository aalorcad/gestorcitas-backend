server:
  port: ${SERVER_PORT:8084}

spring:
  application:
    name: ms-usuarios
  # Oracle Autonomous Database: 1 instancia, 1 esquema por microservicio (USUARIOS).
  # DB_URL = cadena de conexión TLS de la ADB (o jdbc:oracle:thin:@//localhost:1521/FREEPDB1 en local).
  datasource:
    url: ${DB_URL:jdbc:oracle:thin:@//localhost:1521/FREEPDB1}
    username: ${DB_USER:usuarios}
    password: ${DB_PASSWORD}
    hikari:
      # Always Free admite pocas sesiones simultáneas: 3 servicios x 4 conexiones
      maximum-pool-size: ${DB_POOL_SIZE:4}
      minimum-idle: 1
      connection-timeout: 30000
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
  jackson:
    serialization:
      write-dates-as-timestamps: false

app:
  zona-horaria: ${APP_TIMEZONE:America/Santiago}
  services:
    catalogo-url: ${CATALOGO_URL:http://localhost:8083}
  demo:
    medico-email: ${DEMO_MEDICO_EMAIL:medico1@tu-tenant.onmicrosoft.com}

management:
  endpoints:
    web:
      exposure:
        include: health,info
