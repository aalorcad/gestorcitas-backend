server:
  port: ${SERVER_PORT:8084}

spring:
  application:
    name: ms-usuarios
  # Oracle Autonomous Database: 1 instancia, 1 esquema por microservicio (USUARIOS).
  # DB_URL = cadena de conexión TLS de la ADB (o jdbc:oracle:thin:@//localhost:1521/FREEPDB1 en local).
  datasource:
    url: ${DB_URL:jdbc:oracle:thin:@//localhost:1521/FREEPDB1}
    username: ${DB_USER:usuarios}
    password: ${DB_PASSWORD}
    hikari:
      # Always Free admite pocas sesiones simultáneas: 3 servicios x 4 conexiones
      maximum-pool-size: ${DB_POOL_SIZE:4}
      minimum-idle: 1
      connection-timeout: 30000
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
  jackson:
    serialization:
      write-dates-as-timestamps: false
  # RabbitMQ: clúster de 2 nodos (rabbit1, rabbit2). Spring reconecta al otro nodo si uno cae.
  rabbitmq:
    addresses: ${RABBITMQ_ADDRESSES:localhost:5672}
    username: ${RABBITMQ_USER:gestorcitas}
    password: ${RABBITMQ_PASS:gestorcitas}
    publisher-confirm-type: correlated
    publisher-returns: true
  # Apache Kafka (EP5): clúster de 3 brokers. Productor con acks=all e idempotencia.
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092,localhost:9093,localhost:9094}
    producer:
      acks: all
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
      properties:
        enable.idempotence: true
        max.in.flight.requests.per.connection: 5
        linger.ms: 5
        request.timeout.ms: 10000
        delivery.timeout.ms: 30000
        # Tiempo máximo que send() espera metadatos si el clúster no responde (no bloquear la API)
        max.block.ms: 5000

app:
  zona-horaria: ${APP_TIMEZONE:America/Santiago}
  services:
    catalogo-url: ${CATALOGO_URL:http://localhost:8083}
  demo:
    medico-email: ${DEMO_MEDICO_EMAIL:medico1@tu-tenant.onmicrosoft.com}
  # ------------------------------------------------------------------
  # Mensajería (EP3): nombres centralizados del exchange y routing keys de usuarios.
  # La cola de auditoría y su DLQ las declara ms-notificaciones (el consumidor).
  # ------------------------------------------------------------------
  messaging:
    habilitado: ${MESSAGING_ENABLED:true}
    exchanges:
      usuarios-eventos: gestorcitas.usuarios.eventos   # topic
    routing-keys:
      usuario-registrado: usuario.registrado
      usuario-activado: usuario.activado
      usuario-desactivado: usuario.desactivado
  # ------------------------------------------------------------------
  # Streaming (EP5): tópico Kafka COMPACTADO con el último estado de cada usuario. Clave = usuarioId.
  # El tópico lo crea scripts/topicos.sh del repo gestorcitas-kafka (auto-create desactivado en el clúster).
  # ------------------------------------------------------------------
  kafka:
    habilitado: ${KAFKA_ENABLED:true}
    topicos:
      usuarios-estado: gestorcitas.usuarios.estado

management:
  endpoints:
    web:
      exposure:
        include: health,info
