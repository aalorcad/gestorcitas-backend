server:
  port: ${SERVER_PORT:8083}

spring:
  application:
    name: ms-catalogo
  # Oracle Autonomous Database: 1 instancia, 1 esquema por microservicio (CATALOGO).
  # DB_URL = cadena de conexión TLS de la ADB (o jdbc:oracle:thin:@//localhost:1521/FREEPDB1 en local).
  datasource:
    url: ${DB_URL:jdbc:oracle:thin:@//localhost:1521/FREEPDB1}
    username: ${DB_USER:catalogo}
    password: ${DB_PASSWORD}
    hikari:
      # Always Free admite pocas sesiones simultáneas: 3 servicios x 4 conexiones
      maximum-pool-size: ${DB_POOL_SIZE:4}
      minimum-idle: 1
      connection-timeout: 30000
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    properties:
      hibernate:
        format_sql: true

management:
  endpoints:
    web:
      exposure:
        include: health,info
