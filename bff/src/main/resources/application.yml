server:
  port: ${SERVER_PORT:8080}
  forward-headers-strategy: framework

spring:
  application:
    name: bff
  jackson:
    serialization:
      write-dates-as-timestamps: false

app:
  security:
    entra:
      tenant-id: ${ENTRA_TENANT_ID:00000000-0000-0000-0000-000000000000}
      # Con accessTokenAcceptedVersion=2 el "aud" es el Client ID (GUID) de la App Registration de la API.
      # Se acepta también el Application ID URI por si el token viene en formato v1.
      audiences:
        - ${ENTRA_API_CLIENT_ID:00000000-0000-0000-0000-000000000000}
        - ${ENTRA_API_APP_ID_URI:api://gestorcitas-api}
      required-scope: ${ENTRA_REQUIRED_SCOPE:access_as_user}
      # Solo Entra External ID (vacío = tenant workforce, se derivan del Tenant ID)
      issuer-uri: ${ENTRA_ISSUER:}
      jwk-set-uri: ${ENTRA_JWKS_URI:}
      # Rol para usuarios autenticados sin App Roles (autoregistro). Vacío = sin rol.
      default-role: ${ENTRA_DEFAULT_ROLE:}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}
  services:
    catalogo-url: ${CATALOGO_URL:http://localhost:8083}
    citas-url: ${CITAS_URL:http://localhost:8082}
    usuarios-url: ${USUARIOS_URL:http://localhost:8084}

management:
  endpoints:
    web:
      exposure:
        include: health,info

logging:
  level:
    org.springframework.security: INFO
