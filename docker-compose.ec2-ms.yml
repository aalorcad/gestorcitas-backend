# =====================================================================
# EC2-B  gestorcitas-ms  (IP privada en MS_HOST del BFF)
# Levanta los microservicios. El clúster RabbitMQ corre en sus propias instancias:
#   EC2-D gestorcitas-mq1 (rabbit1) y EC2-E gestorcitas-mq2 (rabbit2)  -> repo gestorcitas-rabbitmq (docker-compose.ec2.yml)
# Los microservicios se conectan a ambos nodos por IP privada (MQ1_HOST y MQ2_HOST en el .env):
# si un nodo cae, el cliente se reconecta al otro.
# El clúster Kafka (EP5) corre en EC2-F gestorcitas-kafka (repo gestorcitas-kafka): los microservicios
# usan el listener EXTERNAL de sus 3 brokers por IP privada (KAFKA_HOST en el .env, puertos 9092-9094).
# Solo el BFF (EC2-A) alcanza los microservicios:
# el Security Group gestorcitas-ms-sg abre 8082-8088 únicamente a gestorcitas-sg.
#
# Memoria: son 8 JVM (ms-analitica corre 2 instancias del grupo "analitica"). En una t3.medium usa
# JAVA_XMX=256m en el .env de esta instancia.
#
#   docker compose -f docker-compose.ec2-ms.yml up -d --build
# =====================================================================
x-java-env: &java-env
  JAVA_TOOL_OPTIONS: "-Xms64m -Xmx${JAVA_XMX:-384m} -XX:+UseSerialGC"
  TZ: America/Santiago
  APP_TIMEZONE: America/Santiago
  DB_URL: ${DB_URL}
  DB_POOL_SIZE: ${DB_POOL_SIZE:-4}

x-kafka-env: &kafka-env
  KAFKA_BOOTSTRAP_SERVERS: ${KAFKA_HOST:?Define KAFKA_HOST (IP privada de la EC2 de Kafka)}:9092,${KAFKA_HOST}:9093,${KAFKA_HOST}:9094

x-analitica: &analitica
  build: ./ms-analitica
  image: gestorcitas-ms-analitica
  restart: unless-stopped
  environment:
    <<: [*java-env, *kafka-env]
    DB_USER: ${ANALITICA_DB_USER:-ANALITICA}
    DB_PASSWORD: ${ANALITICA_DB_PASSWORD:?Define ANALITICA_DB_PASSWORD en el .env}
    DB_POOL_SIZE: 2

x-rabbit-env: &rabbit-env
  RABBITMQ_ADDRESSES: ${MQ1_HOST:?Define MQ1_HOST (IP privada de EC2-D)}:5672,${MQ2_HOST:?Define MQ2_HOST (IP privada de EC2-E)}:5672
  RABBITMQ_USER: ${RABBITMQ_USER:-gestorcitas}
  RABBITMQ_PASS: ${RABBITMQ_PASS:?Define RABBITMQ_PASS en el .env}

services:
  ms-catalogo:
    build: ./ms-catalogo
    container_name: gestorcitas-ms-catalogo
    restart: unless-stopped
    environment:
      <<: *java-env
      DB_USER: ${CATALOGO_DB_USER:-CATALOGO}
      DB_PASSWORD: ${CATALOGO_DB_PASSWORD}
    ports: ["8083:8083"]

  ms-usuarios:
    build: ./ms-usuarios
    container_name: gestorcitas-ms-usuarios
    restart: unless-stopped
    environment:
      <<: [*java-env, *rabbit-env, *kafka-env]
      DB_USER: ${USUARIOS_DB_USER:-USUARIOS}
      DB_PASSWORD: ${USUARIOS_DB_PASSWORD}
      CATALOGO_URL: http://ms-catalogo:8083
      DEMO_MEDICO_EMAIL: ${DEMO_MEDICO_EMAIL}
    depends_on:
      ms-catalogo:
        condition: service_started
    ports: ["8084:8084"]

  ms-citas:
    build: ./ms-citas
    container_name: gestorcitas-ms-citas
    restart: unless-stopped
    environment:
      <<: [*java-env, *rabbit-env, *kafka-env]
      DB_USER: ${CITAS_DB_USER:-CITAS}
      DB_PASSWORD: ${CITAS_DB_PASSWORD}
      USUARIOS_URL: http://ms-usuarios:8084
    depends_on:
      ms-usuarios:
        condition: service_started
    ports: ["8082:8082"]

  ms-notificaciones:
    build: ./ms-notificaciones
    container_name: gestorcitas-ms-notificaciones
    restart: unless-stopped
    environment:
      JAVA_TOOL_OPTIONS: "-Xms64m -Xmx${JAVA_XMX:-384m} -XX:+UseSerialGC"
      TZ: America/Santiago
      COMPROBANTES_DIR: /data/comprobantes
      SIMULAR_DOMINIO_CAIDO: ${SIMULAR_DOMINIO_CAIDO:-falla.test}
      # Oracle: esquema NOTIFICACIONES (historial de lo procesado). Pool pequeño: la ADB Always Free admite pocas sesiones
      DB_URL: ${DB_URL}
      DB_USER: ${NOTIFICACIONES_DB_USER:-NOTIFICACIONES}
      DB_PASSWORD: ${NOTIFICACIONES_DB_PASSWORD:?Define NOTIFICACIONES_DB_PASSWORD en el .env}
      DB_POOL_SIZE: 2
      <<: [*rabbit-env, *kafka-env]
    volumes:
      - comprobantes:/data/comprobantes

  ms-rabbit-admin:
    build: ./ms-rabbit-admin
    container_name: gestorcitas-ms-rabbit-admin
    restart: unless-stopped
    environment:
      JAVA_TOOL_OPTIONS: "-Xms64m -Xmx${JAVA_XMX:-384m} -XX:+UseSerialGC"
      TZ: America/Santiago
      RABBITMQ_MANAGEMENT_URL: http://${MQ1_HOST}:15672
      <<: *rabbit-env
    ports: ["8085:8085"]

  # ------------------------------------------------------------------ Kafka (EP5)
  # 2 instancias del grupo "analitica": Kafka les reparte las particiones. Solo la primera publica el
  # puerto 8088 para el BFF (ambas leen los mismos datos de Oracle).
  ms-analitica:
    <<: *analitica
    container_name: gestorcitas-ms-analitica-1
    ports: ["8088:8088"]

  ms-analitica-2:
    <<: *analitica
    container_name: gestorcitas-ms-analitica-2

  ms-kafka-admin:
    build: ./ms-kafka-admin
    container_name: gestorcitas-ms-kafka-admin
    restart: unless-stopped
    environment:
      JAVA_TOOL_OPTIONS: "-Xms64m -Xmx${JAVA_XMX:-384m} -XX:+UseSerialGC"
      TZ: America/Santiago
      <<: *kafka-env
    ports: ["8087:8087"]

volumes:
  comprobantes:
