# =====================================================================
# EC2-B  gestorcitas-ms  (IP privada en MS_HOST del BFF)
# Levanta los microservicios + el clúster RabbitMQ de 2 nodos (EP3/EP4).
# Solo el BFF (EC2-A) alcanza los microservicios:
# el Security Group gestorcitas-ms-sg abre 8082-8085 únicamente a gestorcitas-sg.
# RabbitMQ (5672/15672) NO se publica hacia internet; para ver el panel usa un túnel SSH:
#   ssh -L 15672:localhost:15672 ec2-user@<IP-EC2-B>
#
#   docker compose -f docker-compose.ec2-ms.yml up -d --build
# =====================================================================
x-java-env: &java-env
  JAVA_TOOL_OPTIONS: "-Xms64m -Xmx${JAVA_XMX:-384m} -XX:+UseSerialGC"
  TZ: America/Santiago
  APP_TIMEZONE: America/Santiago
  DB_URL: ${DB_URL}
  DB_POOL_SIZE: ${DB_POOL_SIZE:-4}

x-rabbit-env: &rabbit-env
  RABBITMQ_ADDRESSES: rabbit1:5672,rabbit2:5672
  RABBITMQ_USER: ${RABBITMQ_USER:-gestorcitas}
  RABBITMQ_PASS: ${RABBITMQ_PASS:?Define RABBITMQ_PASS en el .env}

x-rabbit-node: &rabbit-node
  image: rabbitmq:3.13-management
  restart: unless-stopped
  environment:
    RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-gestorcitas}
    RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASS:?Define RABBITMQ_PASS en el .env}
    RABBITMQ_ERLANG_COOKIE: ${RABBITMQ_ERLANG_COOKIE:?Define RABBITMQ_ERLANG_COOKIE en el .env}
  healthcheck:
    test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
    interval: 10s
    timeout: 10s
    retries: 12
    start_period: 20s

services:
  rabbit1:
    <<: *rabbit-node
    hostname: rabbit1
    container_name: gestorcitas-rabbit1
    volumes:
      - ./infra/rabbitmq/cluster.conf:/etc/rabbitmq/conf.d/20-cluster.conf:ro
      - rabbit1-data:/var/lib/rabbitmq
    ports: ["127.0.0.1:15672:15672"]

  rabbit2:
    <<: *rabbit-node
    hostname: rabbit2
    container_name: gestorcitas-rabbit2
    volumes:
      - ./infra/rabbitmq/cluster.conf:/etc/rabbitmq/conf.d/20-cluster.conf:ro
      - rabbit2-data:/var/lib/rabbitmq
    depends_on:
      rabbit1:
        condition: service_healthy
    ports: ["127.0.0.1:15673:15672"]

  ms-catalogo:
    build: ./ms-catalogo
    container_name: gestorcitas-ms-catalogo
    restart: unless-stopped
    environment:
      <<: *java-env
      DB_USER: ${CATALOGO_DB_USER:-CATALOGO}
      DB_PASSWORD: ${CATALOGO_DB_PASSWORD}
    ports: ["8083:8083"]

  ms-usuarios:
    build: ./ms-usuarios
    container_name: gestorcitas-ms-usuarios
    restart: unless-stopped
    environment:
      <<: [*java-env, *rabbit-env]
      DB_USER: ${USUARIOS_DB_USER:-USUARIOS}
      DB_PASSWORD: ${USUARIOS_DB_PASSWORD}
      CATALOGO_URL: http://ms-catalogo:8083
      DEMO_MEDICO_EMAIL: ${DEMO_MEDICO_EMAIL}
    depends_on:
      ms-catalogo:
        condition: service_started
      rabbit1:
        condition: service_healthy
    ports: ["8084:8084"]

  ms-citas:
    build: ./ms-citas
    container_name: gestorcitas-ms-citas
    restart: unless-stopped
    environment:
      <<: [*java-env, *rabbit-env]
      DB_USER: ${CITAS_DB_USER:-CITAS}
      DB_PASSWORD: ${CITAS_DB_PASSWORD}
      USUARIOS_URL: http://ms-usuarios:8084
    depends_on:
      ms-usuarios:
        condition: service_started
      rabbit1:
        condition: service_healthy
    ports: ["8082:8082"]

  ms-notificaciones:
    build: ./ms-notificaciones
    container_name: gestorcitas-ms-notificaciones
    restart: unless-stopped
    environment:
      JAVA_TOOL_OPTIONS: "-Xms64m -Xmx${JAVA_XMX:-384m} -XX:+UseSerialGC"
      TZ: America/Santiago
      COMPROBANTES_DIR: /data/comprobantes
      SIMULAR_DOMINIO_CAIDO: ${SIMULAR_DOMINIO_CAIDO:-falla.test}
      <<: *rabbit-env
    volumes:
      - comprobantes:/data/comprobantes
    depends_on:
      rabbit1:
        condition: service_healthy
      rabbit2:
        condition: service_healthy

  ms-rabbit-admin:
    build: ./ms-rabbit-admin
    container_name: gestorcitas-ms-rabbit-admin
    restart: unless-stopped
    environment:
      JAVA_TOOL_OPTIONS: "-Xms64m -Xmx${JAVA_XMX:-384m} -XX:+UseSerialGC"
      TZ: America/Santiago
      RABBITMQ_MANAGEMENT_URL: http://rabbit1:15672
      <<: *rabbit-env
    depends_on:
      rabbit1:
        condition: service_healthy
    ports: ["8085:8085"]

volumes:
  rabbit1-data:
  rabbit2-data:
  comprobantes:
