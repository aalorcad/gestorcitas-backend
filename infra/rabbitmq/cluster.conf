# Clúster RabbitMQ de 2 nodos (EP3/EP4).
# Se monta en /etc/rabbitmq/conf.d/ de ambos contenedores. Los nodos se descubren por su
# hostname (rabbit1, rabbit2) y comparten la Erlang cookie definida en el .env.
cluster_formation.peer_discovery_backend = classic_config
cluster_formation.classic_config.nodes.1 = rabbit@rabbit1
cluster_formation.classic_config.nodes.2 = rabbit@rabbit2

# Si un nodo queda aislado (partición de red), se pausa en vez de divergir
cluster_partition_handling = autoheal
