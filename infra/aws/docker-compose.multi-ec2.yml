# ---------------------------------------------------------------------------
# SOLO para la variante "una EC2 por servicio" (docs/04-despliegue-ec2.md, anexo).
# Publica el puerto de cada microservicio para que otras instancias lo alcancen
# por IP privada. Uso en cada instancia (ejemplo ms-citas):
#
#   docker compose -f docker-compose.yml -f infra/aws/docker-compose.multi-ec2.yml \
#     up -d --build --no-deps ms-citas
#
# y en el .env de esa instancia las URLs de los otros servicios, por ejemplo:
#   USUARIOS_URL=http://10.0.1.12:8084
# ---------------------------------------------------------------------------
services:
  ms-catalogo:
    ports: ["8083:8083"]
  ms-usuarios:
    ports: ["8084:8084"]
  ms-citas:
    ports: ["8082:8082"]
