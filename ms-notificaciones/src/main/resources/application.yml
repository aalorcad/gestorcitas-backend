server:
  port: ${SERVER_PORT:8086}

spring:
  application:
    name: ms-notificaciones
  # Oracle Autonomous Database, esquema NOTIFICACIONES: guarda lo que procesa cada consumidor
  # (auditoría de usuarios, notificaciones enviadas y comprobantes generados).
  datasource:
    url: ${DB_URL:jdbc:oracle:thin:@//localhost:1521/FREEPDB1}
    username: ${DB_USER:notificaciones}
    password: ${DB_PASSWORD}
    hikari:
      maximum-pool-size: ${DB_POOL_SIZE:2}
      minimum-idle: 1
      connection-timeout: 30000
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
  jackson:
    serialization:
      write-dates-as-timestamps: false
  # RabbitMQ: clúster de 2 nodos (rabbit1, rabbit2). Si un nodo cae, el cliente se reconecta al otro.
  rabbitmq:
    addresses: ${RABBITMQ_ADDRESSES:localhost:5672}
    username: ${RABBITMQ_USER:gestorcitas}
    password: ${RABBITMQ_PASS:gestorcitas}
    listener:
      simple:
        # ACK MANUAL: cada consumidor confirma (basicAck) o rechaza (basicNack) explícitamente
        acknowledge-mode: manual
        prefetch: 10
        # Un mensaje rechazado nunca vuelve a la misma cola en bucle: va a la DLQ
        default-requeue-rejected: false
        # El servicio arranca aunque las colas aún no existan (las declara RabbitAdmin al conectar)
        missing-queues-fatal: false
  # Apache Kafka (EP5): consumidor del grupo "historial-citas" (ver app.kafka)
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092,localhost:9093,localhost:9094}
    consumer:
      auto-offset-reset: earliest
      enable-auto-commit: false
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.ErrorHandlingDeserializer
      max-poll-records: 50
      properties:
        spring.deserializer.value.delegate.class: org.springframework.kafka.support.serializer.JsonDeserializer
        spring.json.use.type.headers: false
        spring.json.trusted.packages: cl.duoc.gestorcitas.notificaciones.messaging.kafka
    listener:
      ack-mode: record
      # 1 instancia con 3 hilos = 1 consumidor por cada una de las 3 particiones
      concurrency: ${KAFKA_CONCURRENCIA:3}
      missing-topics-fatal: false

app:
  # ------------------------------------------------------------------
  # Mensajería (EP3): TODOS los nombres de colas, exchanges, routing keys y DLQ en un solo lugar.
  # Cada flujo = exchange + routing key + cola principal + cola de reintento (con TTL) + DLQ.
  # ------------------------------------------------------------------
  messaging:
    dead-letter-exchange: gestorcitas.dlx          # direct, recibe los mensajes rechazados
    reintentos:
      maximo: ${MESSAGING_MAX_REINTENTOS:3}         # intentos totales antes de enviar a la DLQ
      espera-ms: ${MESSAGING_ESPERA_MS:5000}        # TTL de la cola de reintento
      header: x-gestorcitas-intento                 # header con el número de intento
    notificaciones-citas:
      exchange: gestorcitas.citas.eventos           # topic (publica ms-citas)
      routing-key: "cita.*"
      cola: q.notificaciones.citas
      cola-reintento: q.notificaciones.citas.retry
      dlq: q.notificaciones.citas.dlq
    comprobantes-citas:
      exchange: gestorcitas.citas.comprobantes      # direct (publica ms-citas)
      routing-key: comprobante.generar
      cola: q.comprobantes.citas
      cola-reintento: q.comprobantes.citas.retry
      dlq: q.comprobantes.citas.dlq
    auditoria-usuarios:
      exchange: gestorcitas.usuarios.eventos        # topic (publica ms-usuarios)
      routing-key: "usuario.#"
      cola: q.auditoria.usuarios
      cola-reintento: q.auditoria.usuarios.retry
      dlq: q.auditoria.usuarios.dlq

  comprobantes:
    directorio: ${COMPROBANTES_DIR:/tmp/gestorcitas/comprobantes}

  # Ayuda para la demo: los correos que terminan en este dominio simulan una caída TEMPORAL del
  # servidor de correo (error recuperable -> reintentos -> DLQ). Vacío = sin simulación.
  simulacion:
    dominio-correo-caido: ${SIMULAR_DOMINIO_CAIDO:falla.test}

  # ------------------------------------------------------------------
  # Streaming (EP5): historial de estados de citas leído desde Kafka.
  # Grupo propio ("historial-citas"): recibe TODOS los eventos aunque ms-analitica también los lea.
  # ------------------------------------------------------------------
  kafka:
    habilitado: ${KAFKA_ENABLED:true}
    grupo: ${KAFKA_GROUP_ID:historial-citas}
    topicos:
      citas-eventos: gestorcitas.citas.eventos
    reintentos:
      maximo: ${KAFKA_MAX_INTENTOS:3}
      espera-ms: ${KAFKA_ESPERA_MS:1000}
    sufijo-dlt: .DLT                      # tópico de errores = <tópico>.DLT (scripts/topicos.sh del repo gestorcitas-kafka)

management:
  endpoints:
    web:
      exposure:
        include: health,info
